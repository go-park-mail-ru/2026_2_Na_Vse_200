# Локальный сокет нужен для инициализации PostgreSQL и работы администратора.
local   postgres,music   music                                            scram-sha-256
local   all              all                                              reject

# TCP для ролей проекта разрешён в непосредственно подключённых подсетях.
host    music            music,music_api,music_migrator,music_monitor   samenet   scram-sha-256
host    all              all                                           all       reject
