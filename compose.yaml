name: navse200

x-backend: &backend
  image: navse200-backend:local
  build:
    context: .

x-psql: &psql
  image: postgres:18-alpine
  entrypoint: ["psql", "-X", "-w", "-v", "ON_ERROR_STOP=1"]
  restart: "no"

x-pg-client: &pg-client
  PGHOST: db
  PGDATABASE: music
  PGSSLMODE: disable
  PGCONNECT_TIMEOUT: "5"

services:
  db:
    image: postgres:18-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/music.conf", "-c", "hba_file=/etc/postgresql/music_hba.conf"]
    environment:
      POSTGRES_USER: music
      POSTGRES_DB: music
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-music_local_dev}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DOCKER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/admin/postgresql.conf:/etc/postgresql/music.conf:ro
      - ./db/admin/diagnostics.conf:/etc/postgresql/diagnostics.conf:ro
      - ./db/admin/pg_hba.conf:/etc/postgresql/music_hba.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  db-roles:
    <<: *psql
    command: ["-f", "/admin/roles.sql"]
    environment:
      <<: *pg-client
      PGUSER: music
      PGPASSWORD: ${DOCKER_POSTGRES_PASSWORD:-music_local_dev}
      PGAPPNAME: music-bootstrap
      MUSIC_MIGRATOR_PASSWORD: ${MUSIC_MIGRATOR_PASSWORD:-music_migrator_local_dev}
      MUSIC_API_PASSWORD: ${MUSIC_API_PASSWORD:-music_api_local_dev}
      MUSIC_MONITOR_PASSWORD: ${MUSIC_MONITOR_PASSWORD:-music_monitor_local_dev}
    volumes:
      - ./db/admin/roles.sql:/admin/roles.sql:ro
      - ./db/checks:/checks:ro
    depends_on:
      db:
        condition: service_healthy

  migrate:
    <<: *backend
    entrypoint: ["/app/app", "migrate"]
    command: ["up"]
    environment:
      POSTGRES_DSN: "postgres://music_migrator@db:5432/music?sslmode=disable&application_name=music-migrate&role=music_owner"
      PGPASSWORD: ${MUSIC_MIGRATOR_PASSWORD:-music_migrator_local_dev}
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  db-grants:
    <<: *psql
    command: ["-f", "/admin/grants.sql"]
    environment:
      <<: *pg-client
      PGUSER: music_migrator
      PGPASSWORD: ${MUSIC_MIGRATOR_PASSWORD:-music_migrator_local_dev}
      PGAPPNAME: music-grants
    volumes:
      - ./db/admin/grants.sql:/admin/grants.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  server:
    <<: *backend
    command: ["server"]
    environment:
      POSTGRES_DSN: "postgres://music_api@db:5432/music?sslmode=disable&application_name=music-api&connect_timeout=5&pool_max_conns=${MUSIC_API_POOL_MAX_CONNS:-8}"
      PGPASSWORD: ${MUSIC_API_PASSWORD:-music_api_local_dev}
      MUSIC_API_POOL_ACQUIRE_TIMEOUT: ${MUSIC_API_POOL_ACQUIRE_TIMEOUT:-250ms}
      APP_ADDR: ":8080"
      MEDIA_ROOT: /app/media
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SESSION_TTL: ${APP_SESSION_TTL:-24h}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
    volumes:
      - ./media:/app/media
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8080}:8080"
    depends_on:
      db-grants:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

  db-monitor:
    <<: *psql
    profiles: [tools]
    command: ["-f", "/monitoring/snapshot.sql"]
    environment:
      <<: *pg-client
      PGUSER: music_monitor
      PGPASSWORD: ${MUSIC_MONITOR_PASSWORD:-music_monitor_local_dev}
      PGAPPNAME: music-monitor
    volumes:
      - ./db/monitoring:/monitoring:ro
      - ./db/checks:/checks:ro
    depends_on:
      db-roles:
        condition: service_completed_successfully

  db-check:
    <<: *psql
    profiles: [tools]
    command: ["-f", "/checks/api.sql"]
    environment:
      <<: *pg-client
      PGUSER: music_api
      PGPASSWORD: ${MUSIC_API_PASSWORD:-music_api_local_dev}
      PGAPPNAME: music-check
    volumes:
      - ./db/checks:/checks:ro
    depends_on:
      db-grants:
        condition: service_completed_successfully

volumes:
  postgres_data:
