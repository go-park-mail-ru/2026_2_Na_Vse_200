syntax = "proto3";

package auth.v1;

option go_package = "2026_2_Na_Vse_200/auth-microservice/api/auth/v1;authv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc GetSession(SessionRequest) returns (Session);
  rpc DeleteSession(SessionRequest) returns (google.protobuf.Empty);
  rpc CheckProfileAccess(CheckProfileAccessRequest) returns (google.protobuf.Empty);
}

message CreateSessionRequest {
  string user_id = 1;
  int64 credential_version = 2;
}

message SessionRequest {
  string session_id = 1;
}

message CheckProfileAccessRequest {
  string session_id = 1;
  string target_user_id = 2;
}

message Session {
  string id = 1;
  string user_id = 2;
  google.protobuf.Timestamp expires_at = 3;
}
